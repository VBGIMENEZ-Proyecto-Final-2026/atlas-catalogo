# Infraestructura local de atlas. Las variables salen del .env (ver .env.example).
#
#   docker compose up -d                       solo la base (para correr la app con ./gradlew bootRun)
#   docker compose --profile app up -d --build la base y la aplicación en contenedores
#
# La base escucha solo en 127.0.0.1: no se expone a la red ZeroTier.
services:
  db:
    image: postgres:17-alpine
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ATLAS_DB_NAME:?definir ATLAS_DB_NAME en .env}
      POSTGRES_USER: ${ATLAS_DB_USER:?definir ATLAS_DB_USER en .env}
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD:?definir ATLAS_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${ATLAS_DB_PORT:-5433}:5432"
    volumes:
      - atlas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # La aplicación. Solo arranca con --profile app, para no cambiar el flujo de desarrollo (base en contenedor,
  # aplicación con bootRun). Lee la configuración del .env y pisa lo que cambia dentro de la red de Compose.
  app:
    profiles: ["app"]
    build: .
    image: atlas-catalogo:dev
    container_name: atlas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro de la red de Compose la base es el servicio "db" en su puerto interno, no localhost:5433.
      ATLAS_DB_HOST: db
      ATLAS_DB_PORT: "5432"
      # La clave pública se monta como archivo de solo lectura; en el contenedor siempre está en esta ruta.
      ATLAS_JWT_PUBLIC_KEY_LOCATION: /run/secrets/jwt-public.pem
      ATLAS_JWT_PUBLIC_KEY: ""
    volumes:
      # Ruta de la clave PÚBLICA en el host: la misma variable del .env que usa bootRun. Sin valor no se puede
      # exigir acá (Compose interpola aun con el perfil apagado y rompería "docker compose up -d"): se monta
      # /dev/null y la aplicación no arranca, con el mensaje de clave inválida.
      # El ":z" es para hosts con SELinux (Fedora): sin él el contenedor no puede leer el archivo montado. Etiqueta
      # el .pem público del host; donde no hay SELinux se ignora.
      - ${ATLAS_JWT_PUBLIC_KEY_LOCATION:-/dev/null}:/run/secrets/jwt-public.pem:ro,z
    ports:
      - "127.0.0.1:${ATLAS_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  atlas-db-data:
