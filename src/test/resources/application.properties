# Valores ficticios para los tests de contexto: nunca se usa el .env real ni se llama a la cátedra.
catedra.rest.base-url=http://catedra.test.invalid
catedra.rest.id-token=token-de-prueba
catedra.redis.host=redis.test.invalid
catedra.redis.port=6379
catedra.redis.username=usuario-de-prueba
catedra.redis.password=clave-de-prueba
catedra.kafka.bootstrap-servers=kafka.test.invalid:9092
catedra.kafka.catalog-topic=catedra.catalog.test
catedra.kafka.consumer-group-id=alumnos-test

# Los tests de contexto no sincronizan al arrancar ni periódicamente (la cátedra ficticia no existe).
atlas.sync.on-startup=false
atlas.sync.periodic-check=false
atlas.sync.kafka.enabled=false
