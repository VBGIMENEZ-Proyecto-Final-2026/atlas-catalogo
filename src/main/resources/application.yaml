spring:
  application:
    name: atlas-catalogo
  # Lee el .env local (ignorado por git) si existe; en CI o con variables de entorno reales no hace falta.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${ATLAS_DB_HOST:localhost}:${ATLAS_DB_PORT:5433}/${ATLAS_DB_NAME:atlas}
    username: ${ATLAS_DB_USER:atlas}
    password: ${ATLAS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      # Los repositorios son todos de JPA; Redis solo se lee con el cliente de la cátedra.
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration

catedra:
  rest:
    base-url: ${CATEDRA_REST_BASE_URL:}
    id-token: ${CATEDRA_ID_TOKEN:}
    connect-timeout: ${CATEDRA_REST_CONNECT_TIMEOUT:3s}
    read-timeout: ${CATEDRA_REST_READ_TIMEOUT:30s}
    retry:
      max-retries: ${CATEDRA_REST_MAX_RETRIES:2}
  redis:
    host: ${CATEDRA_REDIS_HOST:}
    port: ${CATEDRA_REDIS_PORT:}
    username: ${CATEDRA_REDIS_USERNAME:}
    password: ${CATEDRA_REDIS_PASSWORD:}
    connect-timeout: ${CATEDRA_REDIS_CONNECT_TIMEOUT:3s}
    command-timeout: ${CATEDRA_REDIS_COMMAND_TIMEOUT:5s}
    retry:
      max-retries: ${CATEDRA_REDIS_MAX_RETRIES:2}

atlas:
  sync:
    # Con la base vacía (sin versión local) pide el snapshot completo al arrancar.
    on-startup: ${ATLAS_SYNC_ON_STARTUP:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # Si Redis de la cátedra cae, el servicio sigue sirviendo la copia local: no debe figurar como DOWN.
      enabled: false
  endpoint:
    health:
      show-details: never
