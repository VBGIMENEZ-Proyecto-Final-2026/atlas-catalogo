spring:
  application:
    name: atlas-catalogo
  # Lee el .env local (ignorado por git) si existe; en CI o con variables de entorno reales no hace falta.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${ATLAS_DB_HOST:localhost}:${ATLAS_DB_PORT:5433}/${ATLAS_DB_NAME:atlas}
    username: ${ATLAS_DB_USER:atlas}
    password: ${ATLAS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

catedra:
  rest:
    base-url: ${CATEDRA_REST_BASE_URL:}
    id-token: ${CATEDRA_ID_TOKEN:}
    connect-timeout: ${CATEDRA_REST_CONNECT_TIMEOUT:3s}
    read-timeout: ${CATEDRA_REST_READ_TIMEOUT:30s}
    retry:
      max-retries: ${CATEDRA_REST_MAX_RETRIES:2}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
